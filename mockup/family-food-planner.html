<title>Family Food Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a kitchen planner. Phone = one day at a time with a day strip; iPad = full week grid.
   Slot colours carry meaning: breakfast = yolk, lunch = teal, dinner = pesto, 8pm prep = evening blue. */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --surface-2:#E9ECE4; --ink:#1B211D; --muted:#5D6760; --line:#D9DDD3;
  --accent:#2D6A3E; --accent-ink:#FFFFFF; --accent-soft:#DCEADF;
  --yolk:#B87A06; --yolk-soft:#FBEFD0;
  --teal:#21706D; --teal-soft:#D9ECEA;
  --evening:#4447A0; --evening-soft:#E2E3F5;
  --warn:#B63B27; --warn-soft:#F8E0DA;
  --lcd:#18201B; --lcd-ink:#A9F2BE;
  --scrim:rgba(20,26,22,.45);
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111512; --surface:#1A1F1B; --surface-2:#232A25; --ink:#E7EBE5; --muted:#9BA59D; --line:#2F3832;
  --accent:#73C088; --accent-ink:#0D1510; --accent-soft:#1E3325;
  --yolk:#F2BC4E; --yolk-soft:#3A2E12;
  --teal:#63C6C0; --teal-soft:#163433;
  --evening:#A3A6F2; --evening-soft:#25274B;
  --warn:#F2806A; --warn-soft:#3E221C;
  --lcd:#0A0E0B; --lcd-ink:#9DEFB2;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1A1F1B; --surface-2:#232A25; --ink:#E7EBE5; --muted:#9BA59D; --line:#2F3832;
  --accent:#73C088; --accent-ink:#0D1510; --accent-soft:#1E3325;
  --yolk:#F2BC4E; --yolk-soft:#3A2E12;
  --teal:#63C6C0; --teal-soft:#163433;
  --evening:#A3A6F2; --evening-soft:#25274B;
  --warn:#F2806A; --warn-soft:#3E221C;
  --lcd:#0A0E0B; --lcd-ink:#9DEFB2;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding-bottom:110px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.app-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hrow h1{font-size:clamp(24px,5vw,32px);font-weight:750}
.hchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.eve{background:var(--evening-soft);color:var(--evening)}
.pill.yolk{background:var(--yolk-soft);color:var(--yolk)}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:650;font-size:14px;padding:9px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px}

/* Day strip (phone) */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.daybtn{display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;border-radius:12px;font-size:12px;color:var(--muted);position:relative}
.daybtn b{font-family:var(--font-display);font-size:18px;color:var(--ink);font-weight:700}
.daybtn[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.daybtn[aria-selected="true"] b{color:var(--bg)}
.daybtn .dot{width:5px;height:5px;border-radius:50%;background:var(--evening);margin-top:3px}
.daybtn .dot.off{visibility:hidden}
.daybtn.flex{opacity:.45}

/* Day view (phone) */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
.dayhead h2{font-size:22px}
.slots{display:grid;gap:10px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px;text-align:left;width:100%}
.slot-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.slot-label i{width:8px;height:8px;border-radius:3px;display:inline-block}
.s-b{color:var(--yolk)} .s-b i{background:var(--yolk)}
.s-l{color:var(--teal)} .s-l i{background:var(--teal)}
.s-d{color:var(--accent)} .s-d i{background:var(--accent)}
.s-p{color:var(--evening)} .s-p i{background:var(--evening)}
.slot.prep{background:var(--evening-soft);border-color:transparent}
.meal-name{font-family:var(--font-display);font-size:19px;font-weight:650;line-height:1.2}
.meal-sub{font-size:13px;color:var(--muted)}
.reason{font-size:13px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 10px}
.reason b{color:var(--accent)}
.lunch-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-block:2px}
.lunch-row + .lunch-row{border-top:1px dashed var(--line);padding-top:8px}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.poolchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--yolk-soft);border-color:var(--yolk);color:var(--yolk)}
.preplist{margin:0;padding-left:18px;font-size:14px}
.snack{border:1.5px dashed var(--yolk);background:var(--yolk-soft);border-radius:16px;padding:10px 14px;font-size:14px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface-2);font-size:14px}
.flexday{padding:28px 14px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted)}

/* Week grid (iPad) */
.weekgrid{display:grid;grid-template-columns:78px repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.gh{padding:6px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.gh b{font-family:var(--font-display);font-size:20px;color:var(--ink)}
.gh .pill{align-self:flex-start;font-size:10.5px;padding:2px 7px}
.rl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:76px;min-width:0;font-size:12.5px;line-height:1.3}
.gc .t{font-weight:650;font-size:13.5px;overflow-wrap:anywhere}
.gc .m{color:var(--muted);font-size:11.5px}
.gc.prep{background:var(--evening-soft);border-color:transparent}
.gc.flex{background:transparent;border-style:dashed;color:var(--muted);align-items:center;justify-content:center}
.gc.out{background:var(--surface-2)}
.gc .poolchips{gap:3px}
.gc .chip{font-size:11px;padding:3px 7px}
.icon{font-size:12px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.ic-cook{color:var(--accent)} .ic-reheat{color:var(--teal)} .ic-packed{color:var(--yolk)} .ic-out{color:var(--muted)} .ic-host{color:var(--evening)} .ic-new{color:var(--yolk)}

@media (min-width:760px){ .phone-only{display:none!important} }
@media (max-width:759px){ .tablet-only{display:none!important} }

/* Lists: recipes, pantry, shop */
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px}
.section-title h2{font-size:22px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters .chip{white-space:nowrap}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.hero{aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;font-size:56px;position:relative}
.hero .ai{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;background:var(--surface);color:var(--muted);padding:3px 8px;border-radius:999px}
.tone-yolk{background:var(--yolk-soft)} .tone-teal{background:var(--teal-soft)} .tone-accent{background:var(--accent-soft)} .tone-eve{background:var(--evening-soft)} .tone-warn{background:var(--warn-soft)}
.rbody{padding:12px 14px;display:grid;gap:6px}
.rbody h3{font-size:17px;font-weight:650;line-height:1.2}
.times{display:flex;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.times b{color:var(--ink)}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tabs button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.usesoon{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.us{background:var(--warn-soft);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.us .when{font-size:12px;font-weight:700;color:var(--warn)}
.us.calm{background:var(--surface-2)} .us.calm .when{color:var(--muted)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px}
.prow + .prow{border-top:1px solid var(--line)}
.prow .n{font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--surface-2);margin-top:5px;max-width:180px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font-size:12px;font-weight:650;padding:5px 9px;color:var(--muted)}
.seg button[aria-pressed="true"].have{background:var(--accent-soft);color:var(--accent)}
.seg button[aria-pressed="true"].low{background:var(--yolk-soft);color:var(--yolk)}
.seg button[aria-pressed="true"].out{background:var(--warn-soft);color:var(--warn)}

.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.order-head h3{font-size:19px}
.total{font-family:var(--font-display);font-size:24px;font-weight:700;text-align:right}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px}
.irow + .irow{border-top:1px solid var(--line)}
.irow .why{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.price{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.price s{color:var(--muted);font-weight:400;font-size:12px;margin-right:4px}
.order-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);flex-wrap:wrap;font-size:13px}

/* Bottom nav + mic */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.mic-fab{position:fixed;z-index:21;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(76px + env(safe-area-inset-bottom, 0px));width:58px;height:58px;border-radius:50%;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.mic-fab svg{width:24px;height:24px}

/* Sheets and full pages */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){ .scrim{align-items:center} }
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
@media (min-width:760px){ .sheet{border-radius:20px;padding:20px 22px} }
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;
  padding:env(safe-area-inset-top,0px) max(16px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.page-in{max-width:820px;margin:0 auto}
.page-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding-block:12px;gap:10px}

/* Recipe card */
.rhero{border-radius:20px;aspect-ratio:16/8;font-size:90px}
.rtitle{margin:16px 0 4px;font-size:clamp(26px,5vw,36px);font-weight:750;line-height:1.08}
.timesbig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.tb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tb .v{font-family:var(--font-display);font-size:22px;font-weight:700}
.tb .k{font-size:12px;color:var(--muted)}
.tb.eve{background:var(--evening-soft);border-color:transparent}
.cols{display:grid;gap:18px}
@media (min-width:760px){ .cols{grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);align-items:start} }
.ing-group h4{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ing{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums}
.ing .note{color:var(--muted);font-size:12.5px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.buy{background:var(--accent-soft);color:var(--accent)}
.tag.have{background:var(--surface-2);color:var(--muted)}
.phase{margin-top:22px}
.phase-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.phase-h h3{font-size:20px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step .no{font-family:var(--font-display);font-size:26px;font-weight:750;color:var(--muted);line-height:1}
.step .no small{display:block;font-family:var(--font-mono);font-size:11px;font-weight:500;margin-top:4px}
.step h4{margin:0 0 4px;font-size:16px}
.step p{margin:6px 0 0}
.mbadge{display:inline-flex;align-items:stretch;border-radius:8px;overflow:hidden;font-family:var(--font-mono);font-size:12px;max-width:100%;border:1px solid var(--line)}
.mbadge .mn{background:var(--ink);color:var(--bg);padding:3px 7px;font-weight:700;white-space:nowrap}
.mbadge .ms{background:var(--lcd);color:var(--lcd-ink);padding:3px 8px;overflow-wrap:anywhere}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}
.box h3{font-size:17px;margin-bottom:8px}
.stable{width:100%;border-collapse:collapse;font-size:13.5px}
.stable td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.stable td:first-child{font-weight:700;padding-right:12px;white-space:nowrap}
.note-toddler{background:var(--yolk-soft);border-color:transparent}

/* Cook mode */
.cook{position:fixed;inset:0;z-index:50;background:var(--lcd);color:#EEF3EF;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left, 0px))}
.cook .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cook .x{background:rgba(255,255,255,.12);color:#EEF3EF}
.cook .body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:860px;margin:0 auto;width:100%;gap:18px;overflow:auto}
.cook .stepno{font-family:var(--font-mono);color:var(--lcd-ink);font-size:14px}
.cook h2{font-size:clamp(28px,5vw,46px);color:#FFFFFF}
.cook .txt{font-size:clamp(19px,2.8vw,28px);line-height:1.4;color:#DDE5DF}
.cook .txt b{color:#FFFFFF}
.cook .setting{font-family:var(--font-mono);font-size:clamp(18px,3vw,30px);color:var(--lcd-ink);border:1px solid rgba(169,242,190,.35);border-radius:14px;padding:12px 16px;align-self:flex-start;max-width:100%}
.cook .setting small{display:block;font-size:12px;color:#9AA89F;margin-bottom:2px}
.cook .ctrl{display:flex;justify-content:space-between;gap:12px;max-width:860px;margin:0 auto;width:100%}
.cook .ctrl .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#FFFFFF;padding:14px 22px;font-size:16px}
.cook .ctrl .btn.primary{background:var(--lcd-ink);color:#0A0E0B}
.timer{font-family:var(--font-mono);font-size:clamp(34px,7vw,64px);color:#FFFFFF}
.cook .tabs{background:rgba(255,255,255,.08)} .cook .tabs button{color:#9AA89F} .cook .tabs button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#FFFFFF;box-shadow:none}

/* Assistant */
.msgs{display:grid;gap:10px;margin-bottom:14px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;font-size:15px}
.msg.me{justify-self:end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bigmic{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 14px}
.bigmic button{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.bigmic button svg{width:30px;height:30px}
.bigmic.listening button{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 14px var(--accent-soft)}}
@media (prefers-reduced-motion: reduce){ .bigmic.listening button{animation:none} }

function setPrep(D,i,r){

const NUMW={two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
const DISH=[['honey chilli','honey'],['chow mein','chow'],['doner','doner'],['kebab','doner'],['taco','tacos'],['aubergine','tacos'],['fish pie','fishpie'],['casserole','casserole'],['halloumi','halloumi'],['penne','penne'],['pasta','penne'],['bulgur','bulgur'],['frittata','frittata'],['creamy spinach','spinach']];

function findDay(s){ for(let i=0;i<7;i++) for(const w of DAYW[i]) if(new RegExp('\\b'+w+'\\b').test(s)) return i; return -1; }
function parseRequests(text){
 let out=[]; let last=-1;
 const clauses=text.split(/[.;\n,!?]|\band\b|\bbut\b|\balso\b/i).map(s=>s.trim()).filter(Boolean);
 for(const c of clauses){
  const lc=c.toLowerCase(); let day=findDay(lc);
  const pm=lc.match(/\b(\d+|two|three|four|five|six|seven|eight|nine|ten|twelve)\s*(people|adults|of us|guests|persons|portions)/);
  const n=pm?(parseInt(pm[1],10)||NUMW[pm[1]]):null;
  if(day<0&&(n||/guest|friends|make it for/.test(lc))&&last>=0) day=last;
  if(day<0){ out.push({day:-1,type:'general',value:c}); continue; }
  last=day; let hit=false;
  if(/eat(ing)? out|takeaway|restaurant|out for dinner/.test(lc)){ out.push({day,type:'out'}); hit=true; }
  else {
   const dish=DISH.find(([k])=>lc.includes(k));
   if(dish){ out.push({day,type:'dish',value:dish[1]}); hit=true; }
   else { const p=PROTS.find(p=>new RegExp('\\b'+p).test(lc)); if(p){ out.push({day,type:'protein',value:p==='vegetarian'?'veggie':p==='salmon'?'fish':p}); hit=true; } }
   if(n||/guest|friends|visitors|people over|hosting/.test(lc)){ out=out.filter(r=>!(r.day===day&&r.type==='people')); out.push({day,type:'people',value:n||5}); hit=true; }
   if(/\bquick|\beasy\b|\bfast\b|\bsimple\b/.test(lc)){ out.push({day,type:'quick'}); hit=true; }
  }
  if(!hit) out.push({day,type:'general',value:c});
 }
 const seen=new Set();
 return out.filter(r=>{ r.key=r.day+'|'+r.type+'|'+(r.value||''); if(seen.has(r.key)) return false; seen.add(r.key); return true; });
}

}

 </div><div>

  <div class="phase"><div class="phase-h"><span class="pill ok">Phase 2</span><h3>Dinner-time finish</h3></div>
   ${r.phase2.map((s,n)=>`<div class="step"><div class="no">${n+1}<small>${s.at} min</small></div><div><h4>${s.t}</h4>${badge(s.m,s.s)}<p>${bold(s.b)}</p></div></div>`).join('')}</div>
  <div class="box"><h3>Machine settings</h3><table class="stable">${r.settings.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table></div>
  <div class="box"><h3>Reheating for the office</h3>${r.reheat}</div>
 </div></div></div></div>`;
 layer(html); bindRecipe(k);
 document.querySelectorAll('[data-por]').forEach(b=>b.onclick=()=>{const y=$('#rpage').scrollTop;openRecipe(k,+b.dataset.por);$('#rpage').scrollTop=y});

function bindRecipe(){

/* ---------- Cook mode ---------- */
let timerInt=null, wake=null;
function openCook(k,phase,idx){
 const r=R[k]; const steps=r[phase]; const s=steps[idx];
 clearInterval(timerInt);
 if(!wake && navigator.wakeLock){ navigator.wakeLock.request('screen').then(w=>{wake=w}).catch(()=>{}); }
 const el=document.createElement('div'); el.className='cook'; el.id='cook';
 el.innerHTML=`<div class="top"><div class="tabs"><button data-ph="phase1" aria-selected="${phase==='phase1'}">8pm prep</button><button data-ph="phase2" aria-selected="${phase==='phase2'}">Dinner</button></div>
   <div style="display:flex;gap:8px"><button class="x" id="cookMic" aria-label="Ask the assistant" style="width:40px;height:40px">${MIC.replace('<svg','<svg width="20" height="20"')}</button><button class="x" id="cookX" aria-label="Exit cook mode" style="width:40px;height:40px">×</button></div></div>
  <div class="body">
   <div class="stepno">${r.title.toUpperCase()} · STEP ${idx+1} OF ${steps.length}${s.at!=null?` · AT ${s.at} MIN`:''}</div>
   <h2>${s.t}</h2>
   ${s.m?`<div class="setting"><small>${s.m}</small>${s.s||''}</div>`:''}
   <div class="txt">${bold(s.b)}</div>
   ${s.timer?`<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><span class="timer num" id="tval">${String(s.timer).padStart(2,'0')}:00</span><button class="btn" id="tbtn" style="background:rgba(255,255,255,.1);border-color:transparent;color:#fff">Start timer</button></div>`:''}
  </div>
  <div class="ctrl"><button class="btn" id="prev" ${idx===0?'disabled style="opacity:.35"':''}>← Back</button><button class="btn primary" id="next">${idx===steps.length-1?'Done':'Next step →'}</button></div>`;
 const old=$('#cook'); if(old) old.remove();
 document.body.appendChild(el);
 el.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>openCook(k,b.dataset.ph,0));
 $('#cookX').onclick=closeCook;
 $('#cookMic').onclick=openAssistant;
 $('#prev').onclick=()=>{ if(idx>0) openCook(k,phase,idx-1) };
 $('#next').onclick=()=>{ if(idx<steps.length-1) openCook(k,phase,idx+1); else {closeCook();toast('Marked as cooked: ingredients taken off the pantry')} };
 const tb=$('#tbtn'); if(tb) tb.onclick=()=>{
  let left=s.timer*60; tb.textContent='Running…'; tb.disabled=true;
  timerInt=setInterval(()=>{left--; const m=Math.floor(left/60), sec=left%60; $('#tval').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); if(left<=0){clearInterval(timerInt);toast('Timer done: '+s.t)}},1000);
 };
}
function closeCook(){clearInterval(timerInt);const c=$('#cook');if(c)c.remove();if(wake){wake.release().catch(()=>{});wake=null}}

   return `<div class="prow"><span class="n">${n}</span><span class="seg">${['have','low','out'].map(v=>`<button class="${v}" data-st="${i}|${v}" aria-pressed="${s===v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</span></div>`}).join('')}</div>`;

 }
 $('#main').innerHTML=html;
 document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{state.pantryTab=b.dataset.pt;render()});

function sparCard(){

/* ---------- Assistant ---------- */
const QA=[
 {q:'I’ve run out of Dijon mustard. What can I use?',a:()=>`Thursday’s creamy sauce uses 1 tsp Dijon. Use <b>½ tsp apple cider vinegar plus a pinch of turmeric</b> instead; you have both. Want me to note that on Thursday’s recipe and add Dijon to next Sunday’s list?`,acts:[['Yes, do both','dijon'],['Just this once','dijon1']]},
 {q:'Can I use chicken thighs instead of breast in the honey chilli?',a:()=>`Yes. Thighs take about <b>3 minutes longer</b> in the HY at 180°C; cook to 74°C on the MEATER as usual. You’d need 1.2kg. There are none in the pantry, so I’d swap them on next Sunday’s order.`,acts:[['Swap on the order','thighs']]},
 {q:'We’re eating out on Thursday.',a:()=>`Thursday’s creamy spinach chicken uses the 200g spinach, which goes off on Thursday. I’d <b>mark Thursday as eating out</b>, use the spinach in <b>toddler spinach & feta muffins on Wednesday</b>, and freeze the 300g chicken for next week. Shall I do that?`,acts:[['Yes, change the plan','thu'],['Just mark eating out','thu']]}
];
let chat=[];
function speak(html){
 if(!state.speak||!('speechSynthesis' in window)) return;
 try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(html.replace(/<[^>]+>/g,'')); u.lang='en-GB'; speechSynthesis.speak(u);}catch(e){}
}
function openAssistant(){
 sheet(`<div class="sheet-head"><h2>Kitchen assistant</h2><div style="display:flex;gap:8px"><button class="btn small" id="spk">${state.speak?'🔊 Voice on':'🔇 Voice off'}</button><button class="x" data-close aria-label="Close">×</button></div></div>
 <div class="msgs" id="msgs">${chat.length?'':`<div class="msg ai">Hi. I know this week’s plan, your pantry and what you’re cooking. Ask me anything.</div>`}${chat.join('')}</div>
 <div class="bigmic" id="bigmic"><button id="talk" aria-label="Hold to talk">${MIC}</button><span class="meal-sub" id="micnote">Tap and speak</span></div>
 <div class="eyebrow" style="margin-bottom:8px">Try asking</div>
 <div class="qchips">${QA.map((x,i)=>`<button data-q="${i}">“${x.q}”</button>`).join('')}</div>`, true);
 $('#spk').onclick=()=>{state.speak=!state.speak;$('#spk').textContent=state.speak?'🔊 Voice on':'🔇 Voice off'};
 $('#talk').onclick=()=>{const m=$('#bigmic');m.classList.add('listening');$('#micnote').textContent='Listening…';
  setTimeout(()=>{m.classList.remove('listening');$('#micnote').textContent='In the real app you just speak. For this mockup, tap a question below.'},1600)};
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(+b.dataset.q));
 bindActs();
 const m=$('#msgs'); m.lastElementChild&&m.lastElementChild.scrollIntoView({block:'end'});
}
function ask(i){
 const x=QA[i]; const ans=x.a();
 chat.push(`<div class="msg me">${x.q}</div>`);
 chat.push(`<div class="msg ai">${ans}<div class="acts">${x.acts.map(([l,id])=>`<button class="btn small" data-act="${id}">${l}</button>`).join('')}</div></div>`);
 openAssistant(); speak(ans);
}
function bindActs(){
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.act; let reply='';
  if(id==='dijon'){state.dijon='out';reply='Done. Thursday’s recipe uses vinegar and turmeric this time, Dijon is marked as out, and it’s on next Sunday’s list.';}
  if(id==='dijon1'){reply='Done. Thursday’s recipe uses vinegar and turmeric this time. The pantry still says you have Dijon.';}
  if(id==='thighs'){reply='Swapped: 1.2kg chicken thighs replace the breast fillets on next Sunday’s order. The recipe card now shows 21 minutes in the HY.';}
  if(id==='thu'){state.thuOut=true;reply='Done. Thursday is eating out, the spinach muffins are on Wednesday, and the chicken is on the freezer list. Thursday is also removed from your Cookidoo planner. Check the Week tab.';render();}
  chat.push(`<div class="msg ai">${reply}</div>`); openAssistant(); speak(reply);
 });
}

/* ---------- Layers ---------- */
function layer(html){ $('#layer').innerHTML=html; $('#layer').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeLayer); }
function sheet(html,keepTop){
 const prevPage=$('#rpage');
 const s=document.createElement('div'); s.className='scrim'; s.id='scrim';
 s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
 s.onclick=e=>{ if(e.target===s) s.remove(); };
 const old=$('#scrim'); if(old) old.remove();
 document.body.appendChild(s);
 s.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>s.remove());
 s.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{s.remove();openRecipe(b.dataset.recipe)});
}
function closeLayer(){ const s=$('#scrim'); if(s){s.remove();return} $('#layer').innerHTML=''; }

/* ---------- Main render ---------- */
function render(){
 renderHeader();
 ({week:renderWeek,recipes:renderRecipes,pantry:renderPantry,shop:renderShop})[state.tab]();
 document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false'));
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;$('#layer').innerHTML='';window.scrollTo(0,0);render()});
$('#micFab').onclick=openAssistant;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#cook')) closeCook(); else closeLayer(); } });
render();
openThisWeek();
})();
